# Shared site logic for tabris.berlin (included by the HTTPS server block).
# The web root contains static files only. Exactly one URL (/api/contact) reaches PHP,
# and that script lives outside the web root.

root /var/www/tabris.berlin/public;
index index.html;
charset utf-8;
charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;
server_tokens off;
absolute_redirect off;

include snippets/tabris-headers.conf;

# --- Request hardening -------------------------------------------------------
client_max_body_size 16k;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 15s;
keepalive_timeout 30s;
large_client_header_buffers 4 8k;

# Static site: read-only methods. (/api/contact overrides this below.)
set $tabris_block "";
if ($request_method !~ ^(GET|HEAD)$) { set $tabris_block "method"; }
if ($uri = /api/contact)            { set $tabris_block ""; }
if ($tabris_block = "method")       { return 405; }

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

error_page 404 /404.html;
error_page 403 =404 /404.html;

# --- Redirects from the previous site ----------------------------------------
location = /legal-notice  { return 301 /en/legal-notice/; }
location = /legal-notice/ { return 301 /en/legal-notice/; }
location = /en            { return 301 /en/; }
# Canonical URLs without "index.html" (checks the original request line only).
if ($request_uri ~ "^/((?:[A-Za-z0-9_-]+/)*)index\.html(?:\?.*)?$") { return 301 https://tabris.berlin/$1; }

# --- Never serve hidden files, source, config or server-side code ------------
location ^~ /.well-known/ {
    include snippets/tabris-headers.conf;
    default_type text/plain;
    try_files $uri =404;
}
location ~ /\. { return 404; }
location ~* \.(?:php\d?|phtml|phar|inc|sh|py|pl|cgi|sql|sqlite|db|bak|old|orig|save|swp|tmp|log|ini|conf|env|yml|yaml|toml|lock|md|dist|tpl|twig|pem|key|crt|zip|tar|gz|tgz|7z|rar)$ { return 404; }
location ~* ^/(?:vendor|private|app|src|tools|tests|deploy|node_modules|composer\.json)(?:/|$) { return 404; }

# --- Contact form endpoint ---------------------------------------------------
location = /api/contact {
    include snippets/tabris-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;

    limit_except GET POST { deny all; }
    limit_req zone=tabris_contact burst=5 nodelay;   # keyed per IPv4 address / IPv6 /64 network
    limit_req_status 429;
    limit_conn tabris_conn 5;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/tabris.berlin/app/contact.php;
    fastcgi_param SCRIPT_NAME /api/contact;
    fastcgi_param HTTP_PROXY "";                 # httpoxy
    fastcgi_param PHP_ADMIN_VALUE "display_errors=0
log_errors=1
allow_url_fopen=0
allow_url_include=0
file_uploads=0
session.use_cookies=0
max_execution_time=20
memory_limit=32M
post_max_size=32K
open_basedir=/var/www/tabris.berlin/app:/var/www/tabris.berlin/vendor:/var/www/tabris.berlin/private";
    fastcgi_hide_header X-Powered-By;
    fastcgi_hide_header Cache-Control;          # set once by nginx above
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Robots-Tag;
    fastcgi_read_timeout 25s;
    fastcgi_pass unix:/run/php/tabris.sock;     # dedicated pool, see deploy/php-fpm/tabris.conf
}
location /api/ { return 404; }

# --- Static assets: long-lived cache (URLs carry a content hash) -------------
location /assets/ {
    include snippets/tabris-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
location = /site.webmanifest {
    include snippets/tabris-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
}
location ~* ^/(?:favicon\.ico|favicon-32\.png|apple-touch-icon\.png)$ {
    include snippets/tabris-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}
location ~* ^/(?:robots\.txt|llms\.txt|sitemap\.xml)$ {
    include snippets/tabris-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# --- HTML pages --------------------------------------------------------------
location / {
    include snippets/tabris-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
