# nginx site configuration for tabris.berlin  (tested with nginx 1.24, Ubuntu 24.04)
# Note: from nginx 1.25.1 on, replace "listen ... ssl http2;" by "listen ... ssl;" plus "http2 on;".
#
# Install:
#   cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   cp deploy/nginx/tabris.berlin.conf /etc/nginx/sites-available/tabris.berlin
#   ln -s ../sites-available/tabris.berlin /etc/nginx/sites-enabled/tabris.berlin
#   nginx -t && systemctl reload nginx

# Rate limiting for the contact endpoint (http context).
# IPv6 clients are grouped by their /64 network so that rotating addresses does not evade the limit.
map $remote_addr $tabris_client {
    "~^(?<net>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" $net;
    default $remote_addr;
}
limit_req_zone  $tabris_client zone=tabris_contact:10m rate=20r/m;
limit_conn_zone $tabris_client zone=tabris_conn:10m;

# Requests with an unknown Host header (IP scans, host-header attacks): close without answering.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tabris.berlin www.tabris.berlin;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://tabris.berlin$request_uri; }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tabris.berlin;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/tabris.berlin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabris.berlin/privkey.pem;
    include snippets/tabris-tls.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://tabris.berlin$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tabris.berlin;

    ssl_certificate     /etc/letsencrypt/live/tabris.berlin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabris.berlin/privkey.pem;
    include snippets/tabris-tls.conf;

    access_log /var/log/nginx/tabris.berlin.access.log;
    error_log  /var/log/nginx/tabris.berlin.error.log warn;

    include snippets/tabris-site.conf;
}
