; Dedicated PHP-FPM pool for the tabris.berlin contact endpoint.
; Install as /etc/php/8.3/fpm/pool.d/tabris.conf, create the user once:
;   adduser --system --group --no-create-home tabris
; A separate pool/user keeps the endpoint isolated from any other site on this server.

[tabris]
user = tabris
group = tabris
listen = /run/php/tabris.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 25s

clear_env = yes
security.limit_extensions = .php
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,pcntl_exec,dl,putenv,symlink,link
