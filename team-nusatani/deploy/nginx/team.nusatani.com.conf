# nginx site for team.nusatani.com (static app; data lives in Supabase)
# Replace YOUR-PROJECT-REF (2×) with the Supabase project ref, e.g. abcdefghijklmnop
# – or, for the self-hosted Supabase on server7, with its host name (and drop ".supabase.co").
#
#   cp deploy/nginx/team.nusatani.com.conf /etc/nginx/sites-available/team.nusatani.com
#   ln -s ../sites-available/team.nusatani.com /etc/nginx/sites-enabled/team.nusatani.com
#   certbot certonly --webroot -w /var/www/letsencrypt -d team.nusatani.com
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name team.nusatani.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://team.nusatani.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name team.nusatani.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/team.nusatani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team.nusatani.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:team_ssl:10m;

    root /var/www/team.nusatani.com/public;
    index index.html;
    charset utf-8;

    set $supa "https://YOUR-PROJECT-REF.supabase.co wss://YOUR-PROJECT-REF.supabase.co";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: $supa; font-src 'self'; connect-src 'self' $supa; frame-src 'self' blob: $supa; media-src 'self' blob: $supa; manifest-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # app files: always revalidate so updates arrive immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: $supa; font-src 'self'; connect-src 'self' $supa; frame-src 'self' blob: $supa; media-src 'self' blob: $supa; manifest-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
    location ~ /\. { deny all; }
}
